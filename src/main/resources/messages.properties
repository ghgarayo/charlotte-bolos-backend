# Mensagens da aplicacao, resolvidas por MessageService.
#
# Este e o bundle padrao (fallback de qualquer locale). O projeto e brasileiro,
# entao o padrao e portugues; um messages_en.properties pode ser acrescentado
# depois sem mexer aqui.
#
# Lido como UTF-8 por causa de spring.messages.encoding no application.yml, o
# que permite acentuacao direta.
#
# Regra: so entram chaves de algo que existe. Um bundle cheio de chaves de
# funcionalidades inexistentes vira ruido e esconde as que faltam de verdade.

# --- Erros globais ---
error.validation.invalid-data=Dados invalidos
error.internal=Erro interno do servidor
error.conflict.concurrent-update=O registro foi alterado por outra operacao. Recarregue e tente novamente.

# --- Autenticacao e autorizacao ---
error.auth.invalid-credentials=Credenciais invalidas
error.auth.required=Autenticacao necessaria
error.auth.token-expired=Sessao expirada. Faca login novamente.
error.auth.user-disabled=Usuario inativo
error.access.denied=Acesso negado

# --- Nao encontrado ---
error.not-found.user=Usuario nao encontrado: {0}
error.not-found.person=Pessoa nao encontrada: {0}

# --- Sucesso ---
success.auth.logged-in=Autenticado com sucesso
